name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar arquivos web
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      - name: Instalar dependências
        run: npm install

      - name: Instalar Capacitor Assets
        run: npm install --save-dev @capacitor/assets

      - name: Verificar Capacitor e ícone fonte
        run: |
          npx cap --version
          test -f assets/icon.png
          file assets/icon.png

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícones Android
        run: |
          npx capacitor-assets generate --android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Verificar configuração do ícone Android
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          test -d android/app/src/main/res/mipmap-mdpi
          test -d android/app/src/main/res/mipmap-hdpi
          test -d android/app/src/main/res/mipmap-xhdpi
          test -d android/app/src/main/res/mipmap-xxhdpi
          test -d android/app/src/main/res/mipmap-xxxhdpi
          test -d android/app/src/main/res/mipmap-anydpi-v26
          echo 'Ícones Android e AndroidManifest.xml OK'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gerar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Regra-de-3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
