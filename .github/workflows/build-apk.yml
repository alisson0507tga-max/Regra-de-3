name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar arquivos web
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      - name: Instalar dependências
        run: npm install

      - name: Instalar Capacitor Assets e ImageMagick
        run: |
          npm install --save-dev @capacitor/assets
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Verificar Capacitor
        run: npx cap --version

      - name: Criar projeto Android
        run: npx cap add android

      - name: Preparar ícone original
        run: |
          test -f assets/icon.jpg
          file assets/icon.jpg
          convert assets/icon.jpg -resize 1024x1024 assets/icon.png
          file assets/icon.png

      - name: Gerar ícones Android
        run: |
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#158FA7' \
            --iconBackgroundColorDark '#158FA7'

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gerar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Regra-de-3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
