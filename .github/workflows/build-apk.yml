name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Criar pasta web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Instalar dependências
        run: |
          npm install

      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Inicializar Android
        run: |
          npx cap add android

      - name: Sincronizar aplicativo
        run: |
          npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dar permissão ao Gradle
        run: |
          chmod +x android/gradlew

      - name: Gerar APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Regra-de-3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
