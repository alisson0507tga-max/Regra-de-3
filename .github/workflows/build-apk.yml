name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar arquivos web
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      - name: Instalar dependências
        run: npm install

      - name: Instalar Capacitor Assets
        run: npm install --save-dev @capacitor/assets

      - name: Verificar Capacitor
        run: npx cap --version

      - name: Criar projeto Android
        run: npx cap add android

      - name: Verificar ícone
        run: |
          test -f assets/icon.svg
          echo "Ícone SVG encontrado: assets/icon.svg"

      - name: Gerar ícones Android
        run: |
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#149DB5' \
            --iconBackgroundColorDark '#149DB5'

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gerar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Regra-de-3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
